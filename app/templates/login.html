{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Sign in</h1>
  {% if error %}<p class="error" role="alert" data-testid="login-error">{{ error }}</p>{% endif %}
  <form method="post" action="/login" data-testid="login-form">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" value="{{ username }}" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
  </form>
  <p class="hint">Demo users: trader1 / trader1pass · trader2 / trader2pass · viewer1 / viewer1pass</p>
</section>
{% endblock %}
