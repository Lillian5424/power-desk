# Reusable setup step shared by every workflow: Python, pip cache, dependencies,
# and (optionally) Playwright browsers. Change it here once, not in five places.
name: Set up Power Desk
description: Install Python, project dependencies and optionally Playwright browsers
inputs:
  python-version:
    description: Python version
    default: "3.12"
  browsers:
    description: Space-separated Playwright browsers to install ("" for none)
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: requirements*.txt

    - name: Install Python dependencies
      shell: bash
      run: python -m pip install -r requirements-dev.txt

    - name: Install Playwright browsers
      if: inputs.browsers != ''
      shell: bash
      run: python -m playwright install --with-deps ${{ inputs.browsers }}
