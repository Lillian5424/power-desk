[project]
name = "power-desk"
version = "0.1.0"
description = "A small ERCOT-style power trading app with a full automated-testing setup"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "unit: pure-logic tests, no server or browser (auto-applied from tests/unit)",
    "api: HTTP API tests against a running server (auto-applied from tests/api)",
    "e2e: browser tests with Playwright (auto-applied from tests/e2e)",
    "smoke: critical-path subset that runs on every pull request",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection style is intentional
extend-immutable-calls = ["fastapi.Depends", "fastapi.Body"]
